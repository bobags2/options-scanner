[package]
name = "options-scanner"
version = "0.1.0"
edition = "2024"
description = "Options chain scanner with Greeks engine, multi-provider data, and TUI"

[dependencies]
# Async / HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Math
statrs = "0.17"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Caching
moka = { version = "0.12", features = ["future"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Rate limiting
governor = "0.6"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait support
async-trait = "0.1"
